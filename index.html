<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股T+0量化计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <header>
            <h1>A股高抛低吸计算器</h1>
            <p>根据成本和盈利目标，计算精确的交易价格</p>
        </header>

        <main>
            <div class="input-group">
                <label for="basePrice">基准价格 (元)</label>
                <input type="number" id="basePrice" placeholder="您买入或卖出的价格">
            </div>

            <div class="input-group">
                <label for="shares">股票数量 (股)</label>
                <input type="number" id="shares" placeholder="例如: 1000">
            </div>

            <div class="input-group">
                <label for="commissionRate">佣金率 (%)</label>
                <input type="number" id="commissionRate" value="0.025" step="0.001" placeholder="例如: 0.025 (万2.5)">
            </div>
            
            <div class="input-group radio-group">
                <label>计算目标:</label>
                <input type="radio" id="calcSell" name="tradeType" value="sell" checked>
                <label for="calcSell">高抛卖出价</label>
                <input type="radio" id="calcBuy" name="tradeType" value="buy">
                <label for="calcBuy">低吸买入价</label>
            </div>

            <div class="input-group radio-group">
                <label>盈利模式:</label>
                <input type="radio" id="profitPercent" name="profitMode" value="percent" checked>
                <label for="profitPercent">百分比</label>
                <input type="radio" id="profitFixed" name="profitMode" value="fixed">
                <label for="profitFixed">固定金额</label>
            </div>
            
            <div class="input-group">
                <label for="profitValue">盈利目标值</label>
                <input type="number" id="profitValue" placeholder="输入百分比(如: 2)或金额(如: 500)">
            </div>

            <button id="calculateBtn">开始计算</button>

            <div id="result" class="result-container hidden">
                <h2>计算结果</h2>
                <p><strong>目标价格:</strong> <span id="targetPrice"></span> 元</p>
                <p><strong>预计净利润:</strong> <span id="netProfit"></span> 元</p>
                <p><strong>总交易成本:</strong> <span id="totalCost"></span> 元</p>
                <div class="cost-details">
                    <p>买入成本: <span id="buyCost"></span></p>
                    <p>卖出成本: <span id="sellCost"></span></p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
