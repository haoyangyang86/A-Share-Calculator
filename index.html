<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>A股T+0量化计算器</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>

    <div class="calculator-container">
        <header>
            <h1>郝T</h1>
            <p>根据成本和盈利目标，计算精确的交易价格</p>
        </header>

        <main>
            <!-- 股票交易计算器 -->
            <div class="calculator-mode">
                <h3>股票交易利润计算器</h3>
                
                <div class="input-group radio-group">
                    <label>交易方向:</label>
                    <input type="radio" id="tradeDirection1" name="tradeDirection" value="buy_sell" checked>
                    <label for="tradeDirection1">高抛低吸 (先买后卖)</label>
                    <input type="radio" id="tradeDirection2" name="tradeDirection" value="sell_buy">
                    <label for="tradeDirection2">低吸高抛 (先卖后买)</label>
                </div>
                
                <div class="input-group">
                    <label for="buyPrice">买入价格 (元)</label>
                    <input type="number" id="buyPrice" placeholder="您买入的价格" step="0.001">
                </div>
                
                <div class="input-group">
                    <label for="sellPrice">卖出价格 (元)</label>
                    <input type="number" id="sellPrice" placeholder="您卖出的价格" step="0.001">
                </div>
                
                <div class="input-group">
                    <label for="shares">股票数量 (股)</label>
                    <input type="number" id="shares" placeholder="例如: 1000">
                </div>
                
                <div class="input-group">
                    <label for="commissionRate">佣金率 (%)</label>
                    <input type="number" id="commissionRate" value="0.025" step="0.001" placeholder="例如: 0.025 (万2.5)">
                </div>
                
                <!-- 成本更新功能 -->
                <div class="cost-update-section">
                    <h4>成本更新功能 (做T后成本计算)</h4>
                    <div class="input-group">
                        <label for="currentCost">当前持仓成本 (元)</label>
                        <input type="number" id="currentCost" placeholder="当前每股成本价格" step="0.001">
                    </div>
                    <div class="input-group">
                        <label for="currentShares">当前持仓数量 (股)</label>
                        <input type="number" id="currentShares" placeholder="当前持有股票数量">
                    </div>
                    <div class="input-group checkbox-group">
                        <input type="checkbox" id="enableCostUpdate">
                        <label for="enableCostUpdate">启用成本更新计算</label>
                    </div>
                </div>
            </div>

            <button id="calculateBtn">开始计算</button>

            <!-- 结果显示区域 -->
            <div id="result" class="result-container hidden">
                <h2>计算结果</h2>
                
                <div class="profit-info">
                    <div class="info-item">
                        <span class="info-label">净利润:</span>
                        <span id="netProfit" class="info-value"></span>
                        <span class="info-unit">元</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">利润率:</span>
                        <span id="profitRate" class="info-value"></span>
                        <span class="info-unit">%</span>
                    </div>
                </div>
                
                <div class="trade-info">
                    <div class="info-item">
                        <span class="info-label">交易方向:</span>
                        <span id="tradeDirectionDisplay" class="info-value"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">买入价:</span>
                        <span id="buyPriceDisplay" class="info-value"></span>
                        <span class="info-unit">元</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">卖出价:</span>
                        <span id="sellPriceDisplay" class="info-value"></span>
                        <span class="info-unit">元</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">股数:</span>
                        <span id="sharesDisplay" class="info-value"></span>
                        <span class="info-unit">股</span>
                    </div>
                </div>
                
                <!-- 通用交易费用信息 -->
                <div class="cost-info">
                    <h3>交易费用明细</h3>
                    <div class="info-item">
                        <span class="info-label">总交易费用:</span>
                        <span id="totalCost" class="info-value"></span>
                        <span class="info-unit">元</span>
                    </div>
                    <div class="cost-details">
                        <div class="info-item">
                            <span class="info-label">买入费用:</span>
                            <span id="buyCost" class="info-value"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">卖出费用:</span>
                            <span id="sellCost" class="info-value"></span>
                        </div>
                    </div>
                </div>
                
                <!-- 成本更新结果 -->
                <div id="costUpdateResult" class="cost-update-result hidden">
                    <h3>交易后成本信息</h3>
                    <div class="cost-update-info">
                        <div class="info-item">
                            <span class="info-label">交易前成本:</span>
                            <span id="beforeCost" class="info-value"></span>
                            <span class="info-unit">元/股</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">交易前持仓:</span>
                            <span id="beforeShares" class="info-value"></span>
                            <span class="info-unit">股</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">交易后成本:</span>
                            <span id="afterCost" class="info-value highlight"></span>
                            <span class="info-unit">元/股</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">交易后持仓:</span>
                            <span id="afterShares" class="info-value"></span>
                            <span class="info-unit">股</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">成本变化:</span>
                            <span id="costChange" class="info-value"></span>
                            <span class="info-unit">元/股</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">成本变化率:</span>
                            <span id="costChangeRate" class="info-value"></span>
                            <span class="info-unit">%</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="history" class="history-container hidden">
                <h2>历史计算记录</h2>
                <div id="historyList" class="history-list"></div>
                <div class="history-actions">
                    <button id="clearHistoryBtn">清空历史记录</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
